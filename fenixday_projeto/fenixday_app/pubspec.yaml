name: fenixday
description: FênixDay — Grid Trading Bot com Inteligência Artificial
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navegação
  go_router: ^14.2.7

  # Banco local (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Segurança — API Keys
  flutter_secure_storage: ^9.2.2

  # Gráficos
  fl_chart: ^0.68.0

  # QR Code (checkout BTCPay)
  qr_flutter: ^4.1.0

  # HTTP + Cripto
  http: ^1.2.1
  crypto: ^3.0.3

  # Formatação
  intl: ^0.19.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # URL Launcher (termos, privacidade)
  url_launcher: ^6.3.0

  # Ícones
  flutter_svg: ^2.0.10+1

  # Misc
  shared_preferences: ^2.3.1
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/
    - assets/images/

  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
