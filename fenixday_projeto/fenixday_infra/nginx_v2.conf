# FênixDay — Nginx v2 (com Flutter Web em /app)
# Adicionada rota /app → serve Flutter Web static files

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;

    # Segurança
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip
    gzip on;
    gzip_types application/json text/plain text/css application/javascript
               application/wasm application/manifest+json;

    # Rate limit zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── HTTP → HTTPS ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS principal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=15768000" always;
        client_max_body_size 5M;

        # ── FastAPI (/api/) ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Rate limit extra na rota de login
        location /api/v1/auth/login {
            proxy_pass         http://api:8000/api/v1/auth/login;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            limit_req zone=login_limit burst=3 nodelay;
        }

        # ── Flutter Web (/app/) ───────────────────────────────────────────────
        location /app/ {
            alias /var/www/fenixday-web/;
            try_files $uri $uri/ /app/index.html;

            # Cache de assets Flutter (hash no nome do arquivo)
            location ~* \.(js|wasm|css|png|jpg|ico|json)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            # Sem cache para index.html (sempre verificar versão nova)
            location = /app/index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass http://api:8000/health;
            access_log off;
        }

        # ── BTCPay ────────────────────────────────────────────────────────────
        location /btcpay/ {
            proxy_pass         http://btcpay:49392/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 60s;
        }

        # ── Bloqueia tudo mais ────────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
