# FênixDay — Docker Compose v2 (com Redis para segurança)
#
# Serviços:
#   nginx      → reverse proxy + SSL
#   api        → FastAPI
#   postgres   → banco central
#   redis      → JWT blacklist + brute force + rate limiting
#   btcpay     → gateway de pagamento
#   nbxplorer  → indexador blockchain

version: "3.9"

networks:
  fenix_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  btcpay_data:
  nbx_data:
  nginx_certs:
  nginx_html:

services:

  postgres:
    image: postgres:16-alpine
    container_name: fenix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-fenixday}
      POSTGRES_USER:     ${POSTGRES_USER:-fenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fenix_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fenix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (JWT blacklist + brute force) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fenix_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - fenix_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  api:
    build:
      context: ../fenixday_server
      dockerfile: Dockerfile
    container_name: fenix_api
    restart: unless-stopped
    environment:
      DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER:-fenix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fenixday}
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:            ${SECRET_KEY}
      PREVIOUS_SECRET_KEY:   ${PREVIOUS_SECRET_KEY:-}
      ALGORITHM:             HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      BTCPAY_SERVER_URL:     ${BTCPAY_SERVER_URL}
      BTCPAY_API_KEY:        ${BTCPAY_API_KEY}
      BTCPAY_STORE_ID:       ${BTCPAY_STORE_ID}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET}
      GOOGLE_CLIENT_ID:      ${GOOGLE_CLIENT_ID}
      LICENSE_PRICE_USDT:    ${LICENSE_PRICE_USDT:-10.00}
      DEBUG:                 "false"
      ENVIRONMENT:           production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fenix_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.5.0
    container_name: fenix_nbxplorer
    restart: unless-stopped
    volumes:
      - nbx_data:/datadir
    environment:
      NBXPLORER_NETWORK: ${BTCPAY_NETWORK:-mainnet}
      NBXPLORER_BIND:    0.0.0.0:32838
      NBXPLORER_CHAINS:  btc
    networks:
      - fenix_net
    expose:
      - "32838"

  btcpay:
    image: btcpayserver/btcpayserver:1.13.0
    container_name: fenix_btcpay
    restart: unless-stopped
    depends_on:
      - nbxplorer
      - postgres
    volumes:
      - btcpay_data:/datadir
    environment:
      BTCPAY_POSTGRES:    User ID=${POSTGRES_USER:-fenix};Password=${POSTGRES_PASSWORD};Host=postgres;Port=5432;Database=btcpay
      BTCPAY_NETWORK:     ${BTCPAY_NETWORK:-mainnet}
      BTCPAY_BIND:        0.0.0.0:49392
      BTCPAY_ROOTPATH:    /btcpay
      BTCPAY_NBXPLORER:   http://nbxplorer:32838
      BTCPAY_EXTERNALURL: https://${DOMAIN}/btcpay
    networks:
      - fenix_net
    expose:
      - "49392"

  nginx:
    image: nginx:1.25-alpine
    container_name: fenix_nginx
    restart: unless-stopped
    depends_on:
      - api
      - btcpay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_html:/var/www/html
    networks:
      - fenix_net
