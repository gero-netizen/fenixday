# Serviços FênixDay v2.0
#   btcpay    → gateway de pagamento
#   nbxplorer → indexador blockchain
#   bitcoin   → nó Bitcoin Core (pruned ~10GB)

version: "3.9"

networks:
  fenix_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  btcpay_data:
  nbx_data:
  nginx_certs:
  nginx_html:
  bitcoin_data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: fenix_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-fenixday}
      POSTGRES_USER:     ${POSTGRES_USER:-fenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fenix_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fenix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # — Redis (JWT blacklist + brute force) ————————————————————————
  redis:
    image: redis:7-alpine
    container_name: fenix_redis
    restart: unless-stopped
    env_file:
      - .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - fenix_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # — API FastAPI ————————————————————————————————————————————————
  api:
    build:
      context: ../fenixday_projeto
      dockerfile: Dockerfile
    container_name: fenix_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fenix_net
    expose:
      - "8000"

  # — Bitcoin Core (pruned) ——————————————————————————————————————
  bitcoin:
    image: btcpayserver/bitcoin:26.0
    container_name: fenix_bitcoin
    restart: unless-stopped
    networks:
      - fenix_net
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    environment:
      BITCOIN_NETWORK: mainnet
      BITCOIN_EXTRA_ARGS: |
        prune=10000
        txindex=0
        server=1
        rpcuser=fenixbtc
        rpcpassword=FenixBTC2026!
        rpcallowip=0.0.0.0/0
        rpcbind=0.0.0.0
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
    expose:
      - "8332"
      - "8333"
      - "28332"
      - "28333"

  # — NBXplorer ——————————————————————————————————————————————————
  nbxplorer:
    image: nicolasdorier/nbxplorer:2.5.0
    container_name: fenix_nbxplorer
    restart: unless-stopped
    depends_on:
      - postgres
      - bitcoin
    volumes:
      - nbx_data:/datadir
    environment:
      - NBXPLORER_POSTGRES=User ID=fenixday;Password=FenixDB2026!;Host=postgres;Port=5432;Database=nbxplorer
      - NBXPLORER_DBTRIE=0
      - NBXPLORER_NETWORK=mainnet
      - NBXPLORER_BIND=0.0.0.0:32838
      - NBXPLORER_BTCRPCURL=http://bitcoin:8332/
      - NBXPLORER_BTCRPCUSER=fenixbtc
      - NBXPLORER_BTCRPCPASSWORD=FenixBTC2026!
      - NBXPLORER_BTCP2P=bitcoin:8333
    networks:
      - fenix_net
    expose:
      - "32838"

  # — BTCPay Server ——————————————————————————————————————————————
  btcpay:
    image: btcpayserver/btcpayserver:1.13.0
    container_name: fenix_btcpay
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - nbxplorer
      - postgres
    volumes:
      - btcpay_data:/datadir
    environment:
      BTCPAY_POSTGRES:     "User ID=${POSTGRES_USER:-fenix};Password=${POSTGRES_PASSWORD};Host=postgres;Port=5432;Database=btcpay"
      BTCPAY_NETWORK:      ${BTCPAY_NETWORK:-mainnet}
      BTCPAY_BIND:         0.0.0.0:49392
      BTCPAY_ROOTPATH:     /btcpay
      BTCPAY_NBXPLORER:    http://nbxplorer:32838
      BTCPAY_EXTERNALURL:  https://${DOMAIN}/btcpay
    networks:
      - fenix_net
    expose:
      - "49392"

  # — Nginx (reverse proxy + SSL) ————————————————————————————————
  nginx:
    image: nginx:1.25-alpine
    container_name: fenix_nginx
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
      - btcpay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx_v2.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - fenix_net
